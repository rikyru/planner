# Porta 80: l'app completa. Senza login: va usata solo in LAN o via VPN.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Upload di foto multiple: limite generoso, il backend valida i file.
    client_max_body_size 200m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}

# Porta 8081: solo i diari condivisi, in sola lettura. È l'unica porta da esporre fuori
# casa (reverse proxy, Cloudflare Tunnel, Tailscale Funnel...): l'editor e le API di
# modifica qui non esistono.
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1k;

    location /api/share/ {
        limit_except GET { deny all; }
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stile della mappa: l'unica altra API usata dalla pagina pubblica.
    location = /api/config {
        limit_except GET { deny all; }
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        try_files $uri =404;
    }

    location /share/ {
        add_header X-Robots-Tag "noindex, nofollow";
        try_files /index.html =404;
    }

    location / {
        return 404;
    }
}
